<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ヘッダー開閉トグルボタン -->
<button id="headerToggleBtn" style="position:fixed;top:10px;left:10px;z-index:1000;background:#333;color:#eee;border:1px solid #444;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:0.9rem;">▼ 操作パネルを隠す</button>

<header class="header">
  <h1>ブックマーク管理</h1>

  <!-- ===============================
        操作パネル
  ================================= -->
  <section class="controls">

    <!-- URL 追加 -->
    <section class="control-group group-add">
      <h2>URL追加</h2>

      <div class="row">
        <input id="tagInput" list="tagSuggestions" placeholder="タグ入力欄">
        <datalist id="tagSuggestions"></datalist>

        <input id="titleInput" placeholder="題名入力欄（空欄で自動取得）">
      </div>

      <div class="row mt-10">
        <input id="urlInput" type="url" placeholder="URL入力欄" class="flex-grow">
        <button id="addBtn">追加</button>
      </div>
    </section>

    <!-- 検索 / ソート / 表示切替 -->
    <section class="control-group group-search">
      <h2>検索 / 表示</h2>

      <div class="row">
        <input id="searchInput" placeholder="検索">
        <select id="tagSelect">
          <option value="">タグ</option>
        </select>
      </div>

      <div class="row mt-10">
        <select id="sortSelect">
          <option value="added">お気に入り優先</option>
          <option value="title">名前順</option>
        </select>
        <button id="viewToggleBtn">表示: グリッド</button>
      </div>
    </section>

    <!-- データ管理 -->
    <section class="control-group group-data">
      <h2>データ管理</h2>

      <div class="row">
        <button id="exportBtn">JSON保存</button>
        <label class="file-label">JSON読込<input type="file" id="importFile" accept=".json" hidden></label>
        <label class="file-label browser-import-label">HTML読込 (Bookmark)<input type="file" id="importBrowserFile" accept=".html" hidden></label>
      </div>
    </section>

    <!-- カウント -->
    <div id="countInfo" class="count-info"></div>

  </section>
</header>

<!-- ===============================
      表示領域
================================= -->
<main id="container"></main>


<!-- ===============================
      右クリック メニュー
================================= -->
<nav id="contextMenu" class="context-menu">
  <ul>
    <li id="cmAddFolder">フォルダ追加</li>
    <li id="cmRenameFolder">フォルダ名変更</li>
    <li id="cmMoveBookmark">フォルダへ移動</li>
    <li id="cmToggleEmpty">空フォルダ表示切替</li>
    <li id="cmEditTag">タグ編集</li>
    <li id="cmEditUrl">URL編集</li>
    <li id="cmEditTitle">題名を編集</li>
    <li id="cmCopyUrl">URLコピー</li>
    <li id="cmDelete" class="delete">削除</li>
  </ul>
</nav>


<script type="module" src="js/main.js"></script>
</body>
</html>
